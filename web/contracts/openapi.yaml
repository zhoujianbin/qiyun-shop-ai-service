      - qty_available
      - qty_reserved
      - qty_in_transit
      - safety_stock
    InventoryLedgerEntry:
      type: object
      description: 库存流水（只追加，不允许修改或删除）。change_type 覆盖采购入库、销售出库、锁定、释放、退货入库、调整、报损、调拨。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        sku_id:
          type: integer
          format: int64
          description: 主键 ID
        warehouse_id:
          type: integer
          format: int64
          description: 主键 ID
        change_type:
          type: string
          enum:
          - PURCHASE_IN
          - SALE_OUT
          - RESERVE
          - RELEASE
          - RETURN_IN
          - ADJUST
          - DAMAGE
          - TRANSFER_IN
          - TRANSFER_OUT
        qty_delta:
          type: integer
          format: int32
          description: 变动数量，正数入库/增加，负数出库/减少，不允许为 0
        qty_after:
          type: integer
          format: int32
          description: 变动后可售结存
        ref_type:
          type:
          - string
          - 'null'
          description: 关联单据类型，例如 ORDER、AFTER_SALES、PURCHASE
        ref_id:
          type:
          - string
          - 'null'
          description: 关联单据 ID
        operator_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        remark:
          type:
          - string
          - 'null'
          description: 备注
        created_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
      required:
      - id
      - sku_id
      - warehouse_id
      - change_type
      - qty_delta
      - qty_after
      - created_at
