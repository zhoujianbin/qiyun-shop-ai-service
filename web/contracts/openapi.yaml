      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      tags:
      - 订单中心
      summary: 订单列表
      operationId: get_orders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                description: 统一分页响应
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 员工按渠道范围过滤；客户仅返回本人订单。需要 shop:order:read 权限。
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: order_no
        in: query
        required: false
        description: 订单号
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 订单业务状态
        schema:
          type: string
          enum:
          - CREATED
          - PENDING_PAYMENT
          - PAID
          - FULFILLING
          - SHIPPED
          - COMPLETED
          - CANCELLED
          - CLOSED
      - name: payment_status
        in: query
        required: false
        description: 支付状态
        schema:
          type: string
          enum:
          - UNPAID
          - PARTIAL
          - PAID
          - REFUNDING
          - PARTIAL_REFUNDED
          - REFUNDED
      - name: fulfillment_status
        in: query
        required: false
        description: 履约状态
        schema:
          type: string
          enum:
          - UNSHIPPED
          - PARTIAL_SHIPPED
          - SHIPPED
          - DELIVERED
      - name: after_sales_status
        in: query
        required: false
        description: 售后状态
        schema:
          type: string
          enum:
          - NONE
          - APPLYING
          - PROCESSING
          - COMPLETED
          - REJECTED
      - name: channel_account_id
        in: query
        required: false
        description: 渠道账号 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
      - name: customer_id
        in: query
        required: false
        description: 客户 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
      - name: created_from
        in: query
        required: false
        description: 下单起始时间
        schema:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
      - name: created_to
        in: query
        required: false
        description: 下单结束时间
        schema:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
