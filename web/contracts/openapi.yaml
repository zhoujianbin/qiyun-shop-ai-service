    Refund:
      type: object
      description: 退款单。退款执行需幂等，并记录每次渠道尝试。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        refund_no:
          type: string
          description: 退款单号
        order_id:
          type: integer
          format: int64
          description: 主键 ID
        payment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        after_sales_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        customer_id:
          type: integer
          format: int64
          description: 主键 ID
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{1,12}(\.\d{1,2})?$
          description: 金额，对应数据库 numeric(14,2)，币种固定 CNY；以字符串传输，禁止使用浮点数。
          example: '199.00'
        currency:
          type: string
          enum:
          - CNY
          default: CNY
          description: 币种，第一期固定为 CNY
        reason:
          type:
          - string
          - 'null'
          description: 退款原因
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - SUCCESS
          - FAILED
          - CANCELLED
          description: 退款状态
        channel:
          type: string
          description: 退款渠道
        requested_by:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 可为空的时间
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/RefundAttempt'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        version:
          type: integer
          format: int32
      required:
      - id
      - refund_no
      - order_id
      - customer_id
      - amount
      - currency
      - status
    RefundCreateRequest:
      type: object
