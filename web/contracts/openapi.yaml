        sku_id:
          type: integer
          format: int64
          description: 主键 ID
        sku_code:
          type:
          - string
          - 'null'
          description: SKU 编码
        product_name:
          type:
          - string
          - 'null'
          description: 商品名称
        sku_name:
          type:
          - string
          - 'null'
          description: SKU 名称
        qty_available:
          type: integer
          format: int32
          minimum: 0
          description: 可售数量
        qty_reserved:
          type: integer
          format: int32
          minimum: 0
          description: 锁定数量
        qty_in_transit:
          type: integer
          format: int32
          minimum: 0
          description: 在途数量
        safety_stock:
          type: integer
          format: int32
          minimum: 0
          description: 安全库存
        is_low_stock:
          type: boolean
          description: 可售数量是否低于或等于安全库存
        version:
          type: integer
          format: int32
          description: 乐观锁版本号，库存调整必须携带
