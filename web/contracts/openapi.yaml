openapi: 3.1.0
info:
  title: 栖云智家科技有限公司 · 第一期企业电商基础平台 API
  version: 1.0.0
  description: '栖云智家科技有限公司第一期企业电商基础平台 API。


    - 企业产品：智能门锁、家用摄像头、清洁机器人、智能灯具、家庭网关、配件耗材，以及云服务、上门安装与维修服务。

    - 销售渠道：官方商城、电商官方旗舰店、授权零售门店。

    - 第一期范围：商品、客户、库存、订单、支付、履约、售后、发票、组织权限、审计。**不包含**智能客服、RAG、本体与工具调用。

    - 第二至四期（知识库、RAG 客服、本体与工具调用）在本期预留扩展点：shared.outbox_event 领域事件表、knowledge 保留 schema（pgvector 0.8.7 已启用）、pg_trgm 全文检索、pgcrypto 加密能力；业务表与事件均为后续阶段可消费的数据底座。

    - 技术栈：Python 3.11 + FastAPI + Pydantic v2 + SQLAlchemy 2.0 + Alembic + psycopg3 + PostgreSQL 17 + Redis 7 + MinIO 兼容 S3；后续三期 Agent 客服使用 LangGraph（Python），因此保持 Python 单体多模块。

    - 数据库模式：单库多 schema —— shared（身份/权限/渠道/审计/附件/幂等/outbox）、commerce（一期业务表）、knowledge（二三期预留）。

    - 金额：numeric(14,2)，币种固定 CNY；JSON 中以字符串传输，禁止浮点。

    - 库存：可售/锁定/在途/安全库存，任何变动写入只追加流水。

    - 幂等：除登录、上传与 webhook 外，所有写接口必须携带 Idempotency-Key，写入 shared.idempotency_record；同 key 同指纹回放，异指纹返回 409。

    - 分页：标准分页 page(>=1) + page_size(1..100)，响应含 PageMeta；审计日志、库存流水、订单时间线等大列表使用 cursor + limit 游标分页并返回 meta.next_cursor。

    - 错误：统一 ApiError{code,message,details?,request_id}，覆盖 400/401/403/404/409/422/429/500。

    - 认证：JWT bearerAuth；/auth/* 的登录/注册/游客/刷新与 /webhooks/* 免默认鉴权，其余接口默认要求 Bearer 令牌。

    - 一期角色：企业管理员、电商运营、库存/仓管、售后专员、财务/只读审计、客服主管；客户为 C 端用户。权限码示例：shop:product:read|write、shop:inventory:read|write、shop:order:read|write、shop:payment:read、shop:fulfillment:write、shop:aftersales:read|review、shop:invoice:read|write、shop:customer:read|write、shared:staff:read|write、shared:audit:read。

    - 元数据脱敏：手机号、真实姓名、银行卡号等按权限脱敏返回；不存储完整支付敏感信息。

    - 状态机：order.status(CREATED/PENDING_PAYMENT/PAID/FULFILLING/SHIPPED/COMPLETED/CANCELLED/CLOSED)；payment_status(UNPAID/PARTIAL/PAID/REFUNDING/PARTIAL_REFUNDED/REFUNDED)；fulfillment_status(UNSHIPPED/PARTIAL_SHIPPED/SHIPPED/DELIVERED)；after_sales_status(NONE/APPLYING/PROCESSING/COMPLETED/REJECTED)。'
  contact:
    name: 栖云智家科技有限公司
  license:
    name: Proprietary
servers:
- url: http://localhost:8000/api/v1
  description: 本地开发环境
security:
- bearerAuth: []
tags:
- name: 认证与身份
  description: 员工、客户、游客登录注册、令牌与密码
- name: 组织与权限
  description: 员工、角色、权限与渠道数据范围
- name: 渠道账号
  description: 官方商城、电商官方旗舰店、授权零售门店
- name: 商品中心
  description: 品牌、分类、SPU/SKU、上下架与公开详情
- name: 附件
  description: 对象存储附件上传与查询
- name: 库存中心
  description: 仓库、结存、调整与只追加流水
- name: 客户中心
  description: 客户档案、地址与客户订单
- name: 购物车
  description: 购物车与条目
- name: 订单中心
  description: 下单、查询、取消、改址、备注、时间线与发货
- name: 支付中心
  description: 支付单、模拟支付与渠道回调
- name: 履约与物流
  description: 承运商、包裹、轨迹与物流回调
- name: 售后中心
  description: 售后申请、审核、寄回、收货、完成与沟通
- name: 退款
  description: 退款单、执行、尝试记录与回调
- name: 发票
  description: 开票申请、开具与作废/红冲
- name: 报表
  description: 经营看板、销售、库存与售后报表
- name: 审计与系统
  description: 审计日志、健康检查与版本信息
paths:
  /auth/staff/login:
    post:
      tags:
      - 认证与身份
      summary: 员工登录
      operationId: post_auth_staff_login
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 企业管理员、电商运营、库存仓管、售后专员、财务只读审计、客服主管使用账号密码登录。登录接口不要求 Idempotency-Key。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      security: []
  /auth/customer/login:
    post:
      tags:
      - 认证与身份
      summary: 客户登录
      operationId: post_auth_customer_login
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: C 端客户使用手机号 + 密码或短信验证码登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLoginRequest'
      security: []
  /auth/customer/register:
    post:
      tags:
      - 认证与身份
      summary: 客户注册
      operationId: post_auth_customer_register
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: C 端客户注册并创建客户档案；同时建立官方商城渠道身份。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
      security: []
  /auth/guest-session:
    post:
      tags:
      - 认证与身份
      summary: 游客会话
      operationId: post_auth_guest_session
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 未注册访客获取游客令牌，用于浏览商品与加购；下单需转为客户身份。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
      security: []
  /auth/refresh:
    post:
      tags:
      - 认证与身份
      summary: 刷新令牌
      operationId: post_auth_refresh
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 使用 refresh_token 换取新的令牌对；refresh_token 一次性轮换，旧令牌立即失效。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/logout:
    post:
      tags:
      - 认证与身份
      summary: 退出登录
      operationId: post_auth_logout
      responses:
        '204':
          description: 操作成功，无返回体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 吊销当前访问令牌及刷新令牌族。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
  /auth/me:
    get:
      tags:
      - 认证与身份
      summary: 当前登录主体
      operationId: get_auth_me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 返回当前主体、角色、权限码与渠道数据范围。
      security:
      - bearerAuth: []
  /auth/password/change:
    post:
      tags:
      - 认证与身份
      summary: 修改密码
      operationId: post_auth_password_change
      responses:
        '204':
          description: 操作成功，无返回体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 修改当前登录主体密码；成功后吊销其他会话的刷新令牌。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      security:
      - bearerAuth: []
  /staff/users:
    get:
      tags:
      - 组织与权限
      summary: 员工列表
      operationId: get_staff_users
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                description: 统一分页响应
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffUser'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 需要 shared:staff:read 权限。
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: keyword
        in: query
        required: false
        description: 按登录名/姓名/邮箱模糊搜索
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 账号状态
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - LOCKED
          - PENDING
      - name: role_code
        in: query
        required: false
        description: 按角色码过滤
        schema:
          type: string
          enum:
          - ENTERPRISE_ADMIN
          - ECOM_OPERATOR
          - INVENTORY_KEEPER
          - AFTER_SALES_SPECIALIST
          - FINANCE_AUDITOR
          - SERVICE_SUPERVISOR
    post:
      tags:
      - 组织与权限
      summary: 创建员工
      operationId: post_staff_users
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 需要 shared:staff:write 权限。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
  /staff/users/{id}:
    get:
      tags:
      - 组织与权限
      summary: 员工详情
      operationId: get_staff_users_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 需要 shared:staff:read 权限。
      parameters:
      - name: id
        in: path
        required: true
        description: 资源 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
    patch:
      tags:
      - 组织与权限
      summary: 更新员工
      operationId: patch_staff_users_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 需要 shared:staff:write 权限。
      parameters:
      - name: id
        in: path
        required: true
        description: 资源 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserUpdateRequest'
  /staff/users/{id}/disable:
    post:
      tags:
      - 组织与权限
      summary: 停用员工
      operationId: post_staff_users_id_disable
      responses:
        '204':
          description: 操作成功，无返回体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 停用后该员工所有令牌失效，禁止登录；需要 shared:staff:write 权限。
      parameters:
      - name: id
        in: path
        required: true
        description: 资源 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
      - $ref: '#/components/parameters/IdempotencyKey'
  /staff/users/{id}/roles:
    get:
      tags:
      - 组织与权限
      summary: 查询员工角色
      operationId: get_staff_users_id_roles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserRoles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 需要 shared:staff:read 权限。
      parameters:
      - name: id
        in: path
        required: true
        description: 资源 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
    put:
      tags:
      - 组织与权限
      summary: 设置员工角色
      operationId: put_staff_users_id_roles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserRoles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 全量覆盖员工角色；需要 shared:role:write 权限，变更写审计。
      parameters:
      - name: id
        in: path
        required: true
        description: 资源 ID
        schema:
