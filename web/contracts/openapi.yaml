          type: string
          enum:
          - PENDING
          - PROCESSING
          - SUCCESS
          - FAILED
        request_payload:
          type:
          - object
          - 'null'
          additionalProperties: true
        response_payload:
          type:
          - object
          - 'null'
          additionalProperties: true
        error_code:
          type:
          - string
          - 'null'
          description: 可为空
        error_message:
          type:
          - string
          - 'null'
          description: 可为空
        attempted_at:
          type: string
          format: date-time
