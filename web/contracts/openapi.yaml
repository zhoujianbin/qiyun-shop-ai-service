          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        order_item_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        amount:
          type:
          - string
          - 'null'
          description: 退款金额
        reason:
          type: string
          description: 退款原因
        channel:
          type:
          - string
          - 'null'
          description: 退款渠道，默认原路退回
      required:
      - order_id
      - reason
    RefundAttempt:
