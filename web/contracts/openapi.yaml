          format: date-time
          description: RFC 3339 时间（UTC）
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        application_count:
          type: integer
          format: int32
        completed_count:
          type: integer
          format: int32
        rejected_count:
          type: integer
          format: int32
        avg_processing_hours:
          type: number
          format: double
          description: 平均处理时长（小时）
        refund_amount:
          type: string
          format: decimal
          pattern: ^-?\d{1,12}(\.\d{1,2})?$
          description: 金额，对应数据库 numeric(14,2)，币种固定 CNY；以字符串传输，禁止使用浮点数。
          example: '199.00'
        by_type:
          type: array
          items:
            type: object
            description: 售后类型维度
            properties:
              type:
                type: string
              count:
                type: integer
                format: int32
        by_status:
          type: array
          items:
            type: object
            description: 售后状态维度
            properties:
              status:
                type: string
                enum:
                - NONE
                - APPLYING
                - PROCESSING
                - COMPLETED
                - REJECTED
              count:
                type: integer
                format: int32
      required:
      - generated_at
      - application_count
    SystemHealth:
      type: object
      description: 系统健康检查。
      properties:
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
        time:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        version:
          type: string
          description: 服务版本
        checks:
          type: array
          items:
            type: object
            description: 依赖检查项
            properties:
              name:
                type: string
                description: 例如 postgres、redis、object_storage
              status:
                type: string
                enum:
                - UP
                - DEGRADED
                - DOWN
              latency_ms:
                type: number
                format: double
              message:
                type:
                - string
                - 'null'
                description: 可为空
      required:
      - status
      - time
    VersionInfo:
      type: object
      description: 版本信息。
      properties:
        name:
          type: string
          description: 服务名称
        version:
          type: string
          description: 应用版本
        api_version:
          type: string
          description: API 版本，例如 v1
        python_version:
          type: string
          description: 运行时版本
        environment:
          type: string
          description: 运行环境，例如 dev/test/prod
        build_time:
          type:
          - string
          - 'null'
          format: date-time
          description: 可为空的时间
        git_commit:
          type:
          - string
          - 'null'
          description: 构建提交号
      required:
      - name
      - version
      - api_version
    WebhookAck:
      type: object
      description: Webhook 统一应答，避免渠道重复推送。
      properties:
        received:
          type: boolean
          description: 是否已接收
        event_id:
          type:
          - string
          - 'null'
          description: 事件 ID
        duplicate:
          type: boolean
          description: 是否为重复事件
        processed:
          type: boolean
          description: 是否已处理完成
        message:
          type:
          - string
          - 'null'
          description: 处理说明
      required:
      - received
    LogisticsCallback:
      type: object
      description: 物流承运商回调报文。
      properties:
        carrier:
          type: string
          description: 承运商编码
        tracking_no:
          type: string
          description: 运单号
        event_time:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        status:
          type: string
          description: 状态码/描述
        description:
          type: string
          description: 轨迹描述
        location:
          type:
          - string
          - 'null'
          description: 发生地
        raw:
          type:
          - object
          - 'null'
          additionalProperties: true
      required:
      - carrier
      - tracking_no
      - event_time
      - status
      - description
    RefundCallback:
      type: object
      description: 退款渠道回调报文。
      properties:
        refund_no:
          type: string
          description: 本地退款单号
        channel:
          type: string
          description: 退款渠道
        channel_refund_no:
          type:
          - string
          - 'null'
          description: 渠道退款单号
        status:
          type: string
          description: 渠道退款状态
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{1,12}(\.\d{1,2})?$
          description: 金额，对应数据库 numeric(14,2)，币种固定 CNY；以字符串传输，禁止使用浮点数。
          example: '199.00'
        currency:
          type: string
          enum:
          - CNY
          default: CNY
          description: 币种，第一期固定为 CNY
        raw:
          type:
          - object
          - 'null'
          additionalProperties: true
      required:
      - refund_no
      - channel
      - status
      - amount
x-platform:
  company: 栖云智家科技有限公司
  module: 企业电商基础平台
  phase: 1
  database_schemas:
  - shared
  - commerce
  - knowledge
  postgresql: '17'
  extensions_available:
  - pgvector 0.8.7
  - pg_trgm
  - pgcrypto
  currency: CNY
  money_type: numeric(14,2) (JSON 字符串)
  idempotency_store: shared.idempotency_record
  outbox:
    table: shared.outbox_event
    phase_1_behavior: 本期只写不消费，为二期知识同步与三四期 Agent/工具事件总线预留
    event_types:
    - order.created
    - order.paid
    - order.cancelled
    - order.shipped
    - order.completed
    - payment.succeeded
    - payment.failed
    - shipment.created
    - shipment.delivered
    - tracking.updated
    - after_sales.applied
    - after_sales.reviewed
    - after_sales.completed
    - refund.created
    - refund.succeeded
    - refund.failed
    - invoice.issued
    - invoice.voided
    - inventory.adjusted
    - inventory.low_stock
    - product.published
    - product.unpublished
    - customer.registered
  reserved_for_later_phases:
    phase_2_knowledge_base: knowledge schema 已保留，本期不提供接口
    phase_3_rag_customer_service: 动态事实查询可复用本期只读接口，写操作沿用幂等与审计
    phase_4_ontology_and_tools: 工具调用通过 outbox_event 与审计日志闭环，本期不实现
    pgvector: 0.8.7 已启用，供二期知识切片向量检索使用
