          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 审计日志数据量大，使用 cursor + limit 游标分页，返回 meta.next_cursor。需要 shared:audit:read 权限。
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: actor_type
        in: query
        required: false
        description: 操作者类型
        schema:
          type: string
          enum:
          - STAFF
          - CUSTOMER
          - GUEST
          - SYSTEM
      - name: actor_id
        in: query
        required: false
        description: 操作者 ID
        schema:
          type: integer
          format: int64
          description: 主键 ID
      - name: action
        in: query
        required: false
        description: 动作，例如 order.cancel
        schema:
          type: string
      - name: resource_type
        in: query
        required: false
        description: 资源类型，例如 Order
        schema:
          type: string
      - name: resource_id
        in: query
        required: false
        description: 资源 ID
        schema:
          type: string
      - name: request_id
        in: query
        required: false
        description: 请求追踪 ID
        schema:
          type: string
      - name: created_from
        in: query
        required: false
        description: 起始时间
        schema:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
      - name: created_to
        in: query
        required: false
        description: 结束时间
        schema:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
  /system/health:
    get:
      tags:
      - 审计与系统
      summary: 健康检查
      operationId: get_system_health
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 探测 PostgreSQL 17（含 pgvector/pg_trgm/pgcrypto）、Redis 7 与对象存储连通性。
  /system/version:
    get:
      tags:
      - 审计与系统
      summary: 版本信息
      operationId: get_system_version
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: 返回服务与 API 版本信息。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT 访问令牌。除 /auth/* 的登录/注册/游客/刷新与 /webhooks/* 外，所有接口默认需要 Authorization: Bearer <token>。'
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始；与 page_size 配合使用标准分页。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，取值 1..100，默认 20。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页游标；用于审计日志、库存流水、订单时间线等大列表，避免深分页。首次请求不传，后续使用 meta.next_cursor。
      schema:
        type:
        - string
        - 'null'
    Limit:
      name: limit
      in: query
      required: false
      description: 游标分页单次返回条数，取值 1..100，默认 20。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写接口必填幂等键。相同 key 且相同请求指纹会回放首次结果；相同 key 但指纹不同返回 409。写入 shared.idempotency_record，有效 24 小时。
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 400 请求参数或业务校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BADREQUEST
            message: 400 请求参数或业务校验失败
            request_id: req_01HZYQ0000000000000000000
    Unauthorized:
      description: 401 未认证或令牌过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHORIZED
            message: 401 未认证或令牌过期
            request_id: req_01HZYQ0000000000000000000
    Forbidden:
      description: 403 已认证但无权限或超出渠道数据范围
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: 403 已认证但无权限或超出渠道数据范围
            request_id: req_01HZYQ0000000000000000000
    NotFound:
      description: 404 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOTFOUND
            message: 404 资源不存在或不可见
            request_id: req_01HZYQ0000000000000000000
    Conflict:
      description: 409 状态冲突、唯一键冲突或幂等键指纹冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: 409 状态冲突、唯一键冲突或幂等键指纹冲突
            request_id: req_01HZYQ0000000000000000000
    UnprocessableEntity:
      description: 422 请求体字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNPROCESSABLEENTITY
            message: 422 请求体字段校验失败
            request_id: req_01HZYQ0000000000000000000
    TooManyRequests:
      description: 429 触发限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: TOOMANYREQUESTS
            message: 429 触发限流
            request_id: req_01HZYQ0000000000000000000
    InternalServerError:
      description: 500 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNALSERVERERROR
            message: 500 服务器内部错误
            request_id: req_01HZYQ0000000000000000000
  schemas:
    ApiError:
      type: object
      description: 统一错误响应。所有非 2xx 响应均返回该结构，便于前端与审计统一处理。
      properties:
        code:
          type: string
          description: 业务错误码，例如 ORDER_INVALID_STATUS
          example: ORDER_INVALID_STATUS
        message:
          type: string
          description: 人类可读的错误说明
        details:
          type:
          - object
          - 'null'
          description: 结构化错误详情，例如字段级校验错误或冲突对象
          additionalProperties: true
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 X-Request-Id 及 shared.audit_log.request_id 一致
      required:
      - code
      - message
      - request_id
    PageMeta:
      type: object
      description: 统一分页元数据。page 从 1 开始，page_size 取值 1..100；大列表可使用游标分页（cursor + limit），此时返回 next_cursor。
      properties:
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 开始
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: 每页条数，1..100
        total:
          type: integer
          minimum: 0
          description: 满足条件的记录总数
        has_more:
          type: boolean
          description: 是否还有下一页
        next_cursor:
          type:
          - string
          - 'null'
          description: 游标分页时返回的下一页游标；使用 page/page_size 分页时为 null
      required:
      - page
      - page_size
      - total
    TokenPair:
      type: object
      description: '登录/刷新返回的令牌对。access_token 为 JWT，放在 Authorization: Bearer 头。'
      properties:
        access_token:
          type: string
          description: JWT 访问令牌
        refresh_token:
          type: string
          description: 刷新令牌（一次性轮换）
        token_type:
          type: string
          enum:
          - Bearer
          default: Bearer
        expires_in:
          type: integer
          format: int32
          description: 访问令牌有效期（秒）
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
    CurrentUser:
      type: object
      description: 当前登录主体（GET /auth/me 或令牌对中返回）。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        tenant_id:
          type: integer
          format: int64
          description: 主键 ID
        party:
          type: string
          enum:
          - STAFF
          - CUSTOMER
          - GUEST
          description: 主体类型：员工/客户/游客
        username:
          type: string
          description: 登录名或客户编号
        display_name:
          type: string
          description: 展示名
        roles:
          type: array
          items:
            type: string
            enum:
            - ENTERPRISE_ADMIN
            - ECOM_OPERATOR
            - INVENTORY_KEEPER
            - AFTER_SALES_SPECIALIST
            - FINANCE_AUDITOR
            - SERVICE_SUPERVISOR
          description: 员工角色码；客户与游客为空数组
        permissions:
          type: array
          items:
            type: string
          description: 权限码集合，例如 shop:order:read
        channel_scope:
          type: array
          items:
            type: string
            enum:
            - OFFICIAL_MALL
            - ECOM_FLAGSHIP
            - AUTHORIZED_RETAIL
          description: 员工可见的渠道范围；管理员为全部渠道
      required:
      - id
      - party
      - display_name
    StaffLoginRequest:
      type: object
      description: 员工登录请求。
      properties:
        username:
          type: string
          description: 员工登录名
        password:
          type: string
          description: 登录密码
          format: password
          minLength: 8
        otp_code:
          type:
          - string
          - 'null'
          description: 可选的一次性动态验证码
      required:
      - username
      - password
    CustomerLoginRequest:
      type: object
      description: 客户登录请求，支持密码或短信验证码二选一。
      properties:
        mobile:
          type: string
          description: 客户手机号
          pattern: ^1[3-9]\d{9}$
        password:
          type:
          - string
          - 'null'
          description: 登录密码，与 sms_code 二选一
        sms_code:
          type:
          - string
          - 'null'
          description: 短信验证码，与 password 二选一
      required:
      - mobile
    CustomerRegisterRequest:
      type: object
      description: 客户注册请求。
      properties:
        mobile:
          type: string
          description: 客户手机号
          pattern: ^1[3-9]\d{9}$
        password:
          type: string
          description: 登录密码
          format: password
          minLength: 8
        sms_code:
          type: string
          description: 短信验证码
        nickname:
          type:
          - string
          - 'null'
          description: 昵称
        channel_account_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
      required:
      - mobile
      - password
      - sms_code
    GuestSessionRequest:
      type: object
      description: 游客会话请求，用于未注册用户浏览商品与加入购物车。
      properties:
        channel_account_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 可为空的外键 ID
        device_id:
          type:
          - string
          - 'null'
          description: 设备指纹，用于游客会话合并
    RefreshRequest:
      type: object
      description: 刷新令牌请求；refresh_token 一次性轮换。
      properties:
        refresh_token:
          type: string
          description: 刷新令牌
      required:
      - refresh_token
    PasswordChangeRequest:
      type: object
      description: 修改当前登录主体密码。
      properties:
        old_password:
          type: string
          description: 原密码
          format: password
        new_password:
          type: string
          description: 新密码，需满足企业密码策略
          format: password
          minLength: 8
      required:
      - old_password
      - new_password
    Role:
      type: object
      description: 角色。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        code:
          type: string
          enum:
          - ENTERPRISE_ADMIN
          - ECOM_OPERATOR
          - INVENTORY_KEEPER
          - AFTER_SALES_SPECIALIST
          - FINANCE_AUDITOR
          - SERVICE_SUPERVISOR
          description: 角色码：企业管理员/电商运营/库存仓管/售后专员/财务只读审计/客服主管
        name:
          type: string
          description: 角色名称
        description:
          type:
          - string
          - 'null'
          description: 角色说明
        permissions:
          type: array
          items:
            type: string
            enum:
            - shop:product:read
            - shop:product:write
            - shop:inventory:read
            - shop:inventory:write
            - shop:order:read
            - shop:order:write
            - shop:payment:read
            - shop:fulfillment:write
            - shop:aftersales:read
            - shop:aftersales:review
            - shop:invoice:read
            - shop:invoice:write
            - shop:customer:read
            - shop:customer:write
            - shop:channel:read
            - shop:channel:write
            - shop:report:read
            - shared:staff:read
            - shared:staff:write
            - shared:role:read
            - shared:role:write
            - shared:audit:read
          description: 该角色拥有的权限码
        is_system:
          type: boolean
          description: 是否系统内置角色，内置角色不可删除
        created_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
      required:
      - id
      - code
      - name
      - permissions
    Permission:
      type: object
      description: 权限字典项。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        code:
          type: string
          enum:
          - shop:product:read
          - shop:product:write
          - shop:inventory:read
          - shop:inventory:write
          - shop:order:read
          - shop:order:write
          - shop:payment:read
          - shop:fulfillment:write
          - shop:aftersales:read
          - shop:aftersales:review
          - shop:invoice:read
          - shop:invoice:write
          - shop:customer:read
          - shop:customer:write
          - shop:channel:read
          - shop:channel:write
          - shop:report:read
          - shared:staff:read
          - shared:staff:write
          - shared:role:read
          - shared:role:write
          - shared:audit:read
          description: 权限码，格式 module:resource:action
        name:
          type: string
          description: 权限名称
        module:
          type: string
          description: 所属模块，例如 shop 或 shared
      required:
      - id
      - code
      - name
      - module
    StaffUser:
      type: object
      description: 员工用户。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        tenant_id:
          type: integer
          format: int64
          description: 主键 ID
        username:
          type: string
          description: 登录名
        display_name:
          type: string
          description: 姓名
        email:
          type:
          - string
          - 'null'
          description: 邮箱
        phone_masked:
          type:
          - string
          - 'null'
          description: 脱敏手机号
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - LOCKED
          - PENDING
          description: 账号状态
        is_super_admin:
          type: boolean
          description: 是否超级管理员
        roles:
          type: array
          items:
            type: string
            enum:
            - ENTERPRISE_ADMIN
            - ECOM_OPERATOR
            - INVENTORY_KEEPER
            - AFTER_SALES_SPECIALIST
            - FINANCE_AUDITOR
            - SERVICE_SUPERVISOR
          description: 角色码
        channel_scope:
          type: array
          items:
            type: string
            enum:
            - OFFICIAL_MALL
            - ECOM_FLAGSHIP
            - AUTHORIZED_RETAIL
          description: 渠道数据范围
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 可为空的时间
        created_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        version:
          type: integer
          format: int32
          description: 乐观锁版本号
      required:
      - id
      - username
      - display_name
      - status
    StaffUserCreateRequest:
      type: object
      description: 创建员工请求。
      properties:
        username:
          type: string
          description: 登录名
          minLength: 3
          maxLength: 64
        display_name:
          type: string
          description: 姓名
          maxLength: 64
        email:
          type:
          - string
          - 'null'
          description: 邮箱
        phone:
          type:
          - string
          - 'null'
          description: 手机号
        password:
          type: string
          description: 初始密码
          format: password
          minLength: 8
        role_codes:
          type: array
          items:
            type: string
            enum:
            - ENTERPRISE_ADMIN
            - ECOM_OPERATOR
            - INVENTORY_KEEPER
            - AFTER_SALES_SPECIALIST
            - FINANCE_AUDITOR
            - SERVICE_SUPERVISOR
          description: 角色码列表
        channel_account_ids:
          type: array
          items:
            type: integer
            format: int64
            description: 主键 ID
          description: 渠道账号 ID 列表，空表示全渠道
      required:
      - username
      - display_name
      - password
      - role_codes
    StaffUserUpdateRequest:
      type: object
      description: 更新员工请求。仅传入需要修改的字段。
      properties:
        display_name:
          type: string
          description: 姓名
        email:
          type:
          - string
          - 'null'
          description: 邮箱
        phone:
          type:
          - string
          - 'null'
          description: 手机号
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - LOCKED
          - PENDING
        version:
          type: integer
          format: int32
          description: 乐观锁版本号，必须与当前值一致
    StaffUserRoles:
      type: object
      description: 员工角色集合。
      properties:
        user_id:
          type: integer
          format: int64
          description: 主键 ID
        role_codes:
          type: array
          items:
            type: string
            enum:
            - ENTERPRISE_ADMIN
            - ECOM_OPERATOR
            - INVENTORY_KEEPER
            - AFTER_SALES_SPECIALIST
            - FINANCE_AUDITOR
            - SERVICE_SUPERVISOR
      required:
      - role_codes
    StaffChannelScopes:
      type: object
      description: 员工渠道数据范围。
      properties:
        user_id:
          type: integer
          format: int64
          description: 主键 ID
        channel_account_ids:
          type: array
          items:
            type: integer
            format: int64
            description: 主键 ID
          description: 渠道账号 ID 列表；空数组表示不限制（仅管理员）
      required:
      - channel_account_ids
    ChannelAccount:
      type: object
      description: 渠道账号。第一期渠道：官方商城、电商官方旗舰店、授权零售门店。
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        code:
          type: string
          description: 渠道编码
        name:
          type: string
          description: 渠道名称
        platform_code:
          type: string
          description: 平台编码，例如 SELF_MALL / TMALL / JD / OFFLINE
        channel_type:
          type: string
          enum:
          - OFFICIAL_MALL
          - ECOM_FLAGSHIP
          - AUTHORIZED_RETAIL
          description: 渠道类型
        external_account_id:
          type:
          - string
          - 'null'
          description: 外部平台店铺或门店标识
        commerce_enabled:
          type: boolean
          description: 是否开启交易能力
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        created_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 时间（UTC）
      required:
      - id
      - code
      - name
      - channel_type
      - status
